name: 初期データ収集（5年分・1日4回）

on:
  schedule:
    - cron: "0 15 * * *"   # 0:00 JST
    - cron: "0 21 * * *"   # 6:00 JST
    - cron: "0  3 * * *"   # 12:00 JST
    - cron: "0  9 * * *"   # 18:00 JST
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 最大6時間

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 差分データ収集（5日分）
        run: python data_collector.py --days 5

      - name: モデル再学習
        run: python model.py
        continue-on-error: true  # データ不足時もワークフローを止めない

      - name: 収集データとモデルをコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/training_data.csv data/model.pkl data/collection_state.json
          git diff --staged --quiet || git commit -m "chore: データ収集 $(date '+%Y-%m-%d %H:%M JST' --date='+9 hours')"
          git push
