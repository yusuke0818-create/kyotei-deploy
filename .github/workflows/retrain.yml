name: 週次モデル再学習（定常運用）

on:
  schedule:
    - cron: "0 18 * * 0"  # 毎週月曜 3:00 JST（UTC 18:00 日曜）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 直近7日分を収集
        run: python data_collector.py --days 7

      - name: モデル再学習
        run: python model.py

      - name: 更新されたデータとモデルをコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/training_data.csv data/model.pkl
          git diff --staged --quiet || git commit -m "chore: 週次モデル再学習 $(date '+%Y-%m-%d')"
          git push
