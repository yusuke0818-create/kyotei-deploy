name: 日次データ収集＋モデル再学習（定常運用）

on:
  schedule:
    - cron: "0 15 * * *"  # 毎日 0:00 JST（UTC 15:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 1日分 ≈ 26分なので余裕あり

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 前日分データを収集
        run: python data_collector.py --days 1

      - name: モデル再学習
        run: python model.py

      - name: 更新されたデータとモデルをコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/training_data.csv data/model.pkl
          git diff --staged --quiet || git commit -m "chore: 日次更新 $(date '+%Y-%m-%d')"
          git push
